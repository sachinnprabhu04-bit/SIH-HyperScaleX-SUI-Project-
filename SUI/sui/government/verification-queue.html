<div class="card">
  <div class="panel-title"><h3>Verification Queue</h3><span class="badge badge-pending" id="queueCount"><span class="badge-dot"></span></span></div>
  <div id="queueList" class="stack-sm"></div>
</div>
<script>
document.addEventListener("DOMContentLoaded", function(){
  var s = SUI.load();
  var others = SUI.otherChallenges();
  var list = document.getElementById("queueList");
  var rows = "";
  if (s.stage === 0) {
    rows += '<a href="problem-review.html" class="card card-hover" style="display:block;border-left:4px solid var(--gold);text-decoration:none;color:inherit;">' +
      '<div class="row-between"><span class="mono muted" style="font-size:.75rem;">' + s.problem.id + '</span><span class="badge badge-pending"><span class="badge-dot"></span>New, pending</span></div>' +
      '<h4 style="text-transform:none;letter-spacing:0;color:var(--ink);margin:8px 0 4px;">' + s.problem.title + '</h4>' +
      '<p style="margin:0;font-size:.82rem;">' + s.problem.district + ', ' + s.problem.category + ', reported ' + SUI.timeAgo(s.problem.reportedAt) + '</p></a>';
  } else if (s.stage > 0) {
    var info = SUI.stageInfo();
    rows += '<a href="problem-review.html" class="card" style="display:block;text-decoration:none;color:inherit;opacity:.85;">' +
      '<div class="row-between"><span class="mono muted" style="font-size:.75rem;">' + s.problem.id + '</span><span class="badge badge-success"><span class="badge-dot"></span>Already reviewed</span></div>' +
      '<h4 style="text-transform:none;letter-spacing:0;color:var(--ink);margin:8px 0 4px;">' + s.problem.title + '</h4>' +
      '<p style="margin:0;font-size:.82rem;">Now at: ' + (info ? info.label : "") + '</p></a>';
  } else if (s.stage === -2) {
    rows += '<div class="card" style="border-left:4px solid var(--danger);"><div class="row-between"><span class="mono muted" style="font-size:.75rem;">' + s.problem.id + '</span><span class="badge badge-danger"><span class="badge-dot"></span>Sent back to citizen</span></div>' +
      '<h4 style="text-transform:none;letter-spacing:0;color:var(--ink);margin:8px 0 4px;">' + s.problem.title + '</h4>' +
      '<p style="margin:0;font-size:.82rem;">Reason: ' + s.problem.rejectionReason + '</p></div>';
  }
  others.forEach(function(o){
    var body = '<p><b>Domain:</b> ' + o.domain + '</p><p><b>District:</b> ' + o.district + '</p><p><b>Status:</b> ' + o.status + '</p><p><b>Universities enrolled:</b> ' + o.unis + '</p><p style="margin-top:10px;color:var(--ink-faint);font-size:.78rem;">Illustrative reference case showing the wider statewide queue. This prototype live walkthrough follows one case, ' + SUI.PROBLEM_ID + '.</p>';
    rows += '<div class="card card-reference" data-info-card tabindex="0" role="button" data-info-title="' + o.id + ': ' + o.title + '" data-info-body="' + body + '">' +
      '<div class="row-between"><span class="mono muted" style="font-size:.75rem;">' + o.id + '</span><span class="badge badge-neutral"><span class="badge-dot"></span>__S__</span>'.replace("__S__","Queued") + '</div>' +
      '<h4 style="text-transform:none;letter-spacing:0;color:var(--ink);margin:8px 0 4px;">' + o.title + '</h4>' +
      '<p style="margin:0;font-size:.82rem;">' + o.district + ', ' + o.domain + '</p>' +
      '<div class="info-card-hint">' + suiIcon("search") + '<span>View reference details</span></div></div>';
  });
  list.innerHTML = rows || `<div class="empty-state">
      <div data-icon="shield"></div>
      <h3>Queue is clear</h3>
      <p>No reports waiting on your review right now.</p>
    </div>`;
  document.getElementById("queueCount").innerHTML = '<span class="badge-dot"></span>' + (s.stage === 0 ? "1 needs review" : "0 need review");
});
</script>
