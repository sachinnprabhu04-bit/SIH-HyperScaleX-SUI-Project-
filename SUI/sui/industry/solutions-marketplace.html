    <main class="content">
      
<p style="max-width:560px;">Validated, government backed university solutions ready to accelerate.</p>
<div id="grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;"></div>
<script>
document.addEventListener("DOMContentLoaded", function(){
  var s = SUI.load();
  var html = "";
  if (s.stage >= 5) {
    html += '<a href="solution-detail.html" class="card card-hover card-accent" style="text-decoration:none;color:inherit;display:block;"><span class="badge badge-success"><span class="badge-dot"></span>Validated</span>' +
      '<h3 style="margin:12px 0 6px;font-size:1.05rem;">' + s.problem.title + '</h3>' +
      '<p style="font-size:.82rem;margin-bottom:12px;">By ' + s.selectedUniversity + '</p>' +
      '<div style="font-size:.78rem;" class="muted">' + s.problem.district + ', ' + s.problem.category + '</div></a>';
  } else {
    html += '<div class="card" style="opacity:.6;"><span class="badge badge-neutral"><span class="badge-dot"></span>Not yet validated</span><h3 style="margin:12px 0 6px;font-size:1.05rem;">Persistent road pothole</h3><p style="font-size:.82rem;">Will appear once a university validates a solution.</p></div>';
  }
  [
    { title: "Solar micro grid for tribal hamlets", uni: "IIT (ISM) Dhanbad", domain: "Energy & Environment", district: "Khunti, Jharkhand" },
    { title: "Low cost water testing kit", uni: "NIT Jamshedpur", domain: "Agriculture & Water", district: "Gumla, Jharkhand" },
    { title: "Digital land record kiosk", uni: "Xavier Institute (Ranchi)", domain: "Land Rights", district: "Ranchi, Jharkhand" }
  ].forEach(function(t){
    var body = '<p><b>University:</b> ' + t.uni + '</p><p><b>Domain:</b> ' + t.domain + '</p><p><b>District:</b> ' + t.district + '</p><p style="margin-top:10px;color:var(--ink-faint);font-size:.78rem;">Illustrative marketplace listing showing the wider platform. This prototype live walkthrough follows one case, ' + SUI.PROBLEM_ID + '.</p>';
    html += '<div class="card card-reference" data-info-card tabindex="0" role="button" data-info-title="' + t.title + '" data-info-body="' + body + '"><span class="badge badge-neutral"><span class="badge-dot"></span>Reference</span><h3 style="margin:12px 0 6px;font-size:1.05rem;">' + t.title + '</h3><p style="font-size:.82rem;margin-bottom:12px;">By ' + t.uni + '</p>' +
      '<div class="info-card-hint">' + suiIcon("search") + '<span>View reference details</span></div></div>';
  });
  document.getElementById("grid").innerHTML = html;
});
</script>
