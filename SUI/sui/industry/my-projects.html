    <main class="content">
      
<div class="card">
  <div class="panel-title"><h3>My Projects</h3></div>
  <div id="projList"></div>
</div>
<script>
document.addEventListener("DOMContentLoaded", function(){
  var s = SUI.load();
  var list = document.getElementById("projList");
  if (!s.funding) {
    list.innerHTML = `<div class="empty-state">
      <div data-icon="briefcase"></div>
      <h3>No committed projects yet</h3>
      <p>Commit CSR support to a validated solution to see it tracked here.</p>
    </div>` +
      '<div class="text-center"><a href="solutions-marketplace.html" class="btn btn-primary">Explore Solutions</a></div>';
    return;
  }
  var info = SUI.stageInfo();
  list.innerHTML = '<table><thead><tr><th>Project</th><th>University</th><th>Committed</th><th>Stage</th><th></th></tr></thead><tbody>' +
    '<tr><td>' + s.problem.title + '</td><td>' + s.selectedUniversity + '</td><td class="mono">' + s.funding.amount + '</td>' +
    '<td><span class="badge badge-progress"><span class="badge-dot"></span>__L__</span>'.replace("__L__", info ? info.label : "") + '</td>' +
    '<td><a href="solution-detail.html" class="btn btn-ghost btn-sm">Open</a></td></tr></tbody></table>';
});
</script>

    </main>
  </div>
</div>
