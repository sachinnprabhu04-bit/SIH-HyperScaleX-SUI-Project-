      <button class="switch-role-btn" data-cmdk-open type="button" style="margin-bottom:8px;"><span data-icon="search" style="width:13px;height:13px;"></span> Jump to a page (Ctrl K)</button>
      <button class="switch-role-btn" data-reset-demo type="button"><span data-icon="clock" style="width:13px;height:13px;"></span> Reload example data</button>
      <button class="switch-role-btn" data-reset-blank type="button" style="margin-top:6px;opacity:.7;font-size:.72rem;"><span data-icon="flag" style="width:12px;height:12px;"></span> Start from a blank slate</button>
    </div>

  <div class="main-col">
    <header class="topbar">
      <div class="row gap-sm">
        <button class="menu-toggle"></button>
        <div class="topbar-title">
          <span class="t-eyebrow">Industry Portal</span>
          <h1>CSR Opportunities</h1>
        </div>
      </div>
      <div class="row gap-sm">
        
        <button class="cmdk-trigger" data-cmdk-open type="button"><span data-icon="search" style="width:14px;height:14px;"></span><span class="cmdk-label">Search</span><kbd>Ctrl K</kbd></button>
        <button class="icon-btn" data-open-modal="notifPanelOverlay" data-notif-role="industry" type="button"><span class="dot" style="display:none;"></span><span data-icon="bell"></span></button>
        <div class="icon-btn" title="Representing: Tata Steel Foundation" style="width:auto;border-radius:999px;padding:0 14px;gap:8px;font-size:.78rem;font-weight:700;">
          <span data-icon="factory" style="width:15px;height:15px;"></span> Tata Steel Foundation
        </div>
      </div>
    </header>
    <div class="overlay" id="notifPanelOverlay">
      <div class="modal" style="max-width:400px;">
        <button class="modal-close" data-close-modal><span data-icon="close"></span></button>
        <div class="eyebrow">Industry Portal</div>
        <h3 style="margin-bottom:16px;">Notifications</h3>
        <div id="notifPanelList" class="stack-sm" data-notif-list="industry" style="max-height:360px;overflow-y:auto;"></div>
      </div>
    </div>
    <main class="content">
      
<div class="stat-grid" style="margin-bottom:22px;">
  <div class="stat-card"><div class="stat-label">Open opportunities</div><div class="stat-value"><span data-countup="12" data-suffix="">0</span></div></div>
  <div class="stat-card"><div class="stat-label">Avg. commitment</div><div class="stat-value">Rs. 5.2L</div></div>
  <div class="stat-card"><div class="stat-label">Districts represented</div><div class="stat-value"><span data-countup="9" data-suffix="">0</span></div></div>
</div>
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;" id="csrGrid"></div>
<script>
document.addEventListener("DOMContentLoaded", function(){
  var s = SUI.load();
  var items = [
    { title: s.problem ? s.problem.title : "Persistent road pothole", tag: s.stage>=5 ? "Ready now" : "In development", district: "Ranchi", domain: s.problem ? s.problem.category : "Urban Infrastructure", link: "solution-detail.html", ready: s.stage>=5, live: true },
    { title: "Solar micro grid for tribal hamlets", district: "Khunti", domain: "Energy & Environment", uni: "IIT (ISM) Dhanbad", ready:false, live:false },
    { title: "Low cost water testing kit", district: "Gumla", domain: "Agriculture & Water", uni: "NIT Jamshedpur", ready:false, live:false },
    { title: "Digital land record kiosk", district: "Latehar", domain: "Land Rights", uni: "Xavier Institute (Ranchi)", ready:false, live:false },
  ];
  document.getElementById("csrGrid").innerHTML = items.map(function(it){
    if (it.live) {
      return '<div class="card' + (it.ready ? ' card-hover card-accent' : '') + '">' +
        '<span class="badge badge-__K__"><span class="badge-dot"></span>__T__</span>'.replace("__T__", it.tag).replace("__K__", it.ready?"success":"neutral") +
        '<h4 style="text-transform:none;letter-spacing:0;color:var(--ink);margin:10px 0 4px;">' + it.title + '</h4>' +
        '<p style="margin:0 0 10px;font-size:.82rem;">' + it.district + ', Jharkhand</p>' +
        (it.ready ? '<a href="' + it.link + '" class="btn btn-outline btn-sm">View and support</a>' : '<span class="muted" style="font-size:.78rem;">Awaiting technical validation</span>') +
        '</div>';
    }
    var body = '<p><b>University:</b> ' + it.uni + '</p><p><b>Domain:</b> ' + it.domain + '</p><p><b>District:</b> ' + it.district + ', Jharkhand</p><p style="margin-top:10px;color:var(--ink-faint);font-size:.78rem;">Illustrative CSR opportunity showing the wider platform. This prototype live walkthrough follows one case, ' + SUI.PROBLEM_ID + '.</p>';
    return '<div class="card card-reference" data-info-card tabindex="0" role="button" data-info-title="' + it.title + '" data-info-body="' + body + '">' +
      '<span class="badge badge-neutral"><span class="badge-dot"></span>Reference</span>' +
      '<h4 style="text-transform:none;letter-spacing:0;color:var(--ink);margin:10px 0 4px;">' + it.title + '</h4>' +
      '<p style="margin:0 0 10px;font-size:.82rem;">' + it.district + ', Jharkhand</p>' +
      '<div class="info-card-hint">' + suiIcon("search") + '<span>View reference details</span></div></div>';
  }).join("");
});
</script>

    </main>
  </div>
</div>
