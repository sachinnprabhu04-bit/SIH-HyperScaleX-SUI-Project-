    <div class="sidebar-foot">
      <button class="switch-role-btn" data-cmdk-open type="button" style="margin-bottom:8px;"><span data-icon="search" style="width:13px;height:13px;"></span> Jump to a page (Ctrl K)</button>
      <button class="switch-role-btn" data-reset-demo type="button"><span data-icon="clock" style="width:13px;height:13px;"></span> Reload example data</button>

    </div>
  </aside>
  <div class="main-col">
    <header class="topbar">
      <div class="row gap-sm">
        <button class="menu-toggle"></button>
        <div class="topbar-title">
          <span class="t-eyebrow">Citizen Portal</span>
          <h1>Report Submitted</h1>
        </div>
      </div>
      <div class="row gap-sm">
        
        <button class="cmdk-trigger" data-cmdk-open type="button"><span data-icon="search" style="width:14px;height:14px;"></span><span class="cmdk-label">Search</span><kbd>Ctrl K</kbd></button>
        <a href="notifications.html" class="icon-btn" data-notif-role="citizen" style="text-decoration:none;"><span class="dot" style="display:none;"></span><span data-icon="bell"></span></a>
        <div class="icon-btn" title="Reporting as: Meera Oraon" style="width:auto;border-radius:999px;padding:0 14px;gap:8px;font-size:.78rem;font-weight:700;">
          <span data-icon="flag" style="width:15px;height:15px;"></span> Meera Oraon
        </div>
      </div>
    </header>
    
    <main class="content">
      
<div class="content-narrow text-center">
  <div style="width:64px;height:64px;border-radius:50%;background:var(--green-tint);color:var(--green-dark);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;">
    <span data-icon="check" style="width:28px;height:28px;display:inline-flex;vertical-align:-3px;"></span>
  </div>
  <h2>Report submitted.</h2>
  <p>Your problem has been logged as <b class="mono" id="pidDisplay"></b> and is now waiting for a government officer to verify it.</p>
  <div class="card" style="text-align:left;margin-top:26px;">
    <div class="stitch-track"><div class="stepper" id="stepperMount"></div></div>
  </div>
  <div class="row gap-sm" style="justify-content:center;margin-top:24px;">
    <a href="problem-detail.html" class="btn btn-primary">Track this report</a>
    <a href="dashboard.html" class="btn btn-outline">Back to dashboard</a>
  </div>
</div>
<script>
document.addEventListener("DOMContentLoaded", function(){
  var s = SUI.load();
  if (!s.problem) { window.location.href = "report-problem.html"; return; }
  document.getElementById("pidDisplay").textContent = s.problem.id;
  renderStepper("stepperMount");
});
</script>

    </main>
  </div>
</div>
