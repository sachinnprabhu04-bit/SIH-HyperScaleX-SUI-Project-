    <main class="content">
      
<div class="card">
  <div class="panel-title"><h3>My Reports</h3></div>
  <div id="reportsBody"></div>
</div>
<script>
document.addEventListener("DOMContentLoaded", function(){
  var s = SUI.load();
  var box = document.getElementById("reportsBody");
  if (!s.problem) {
    box.innerHTML = `<div class="empty-state">
      <div data-icon="list"></div>
      <h3>No reports yet</h3>
      <p>Reports you file will be tracked here from submission to resolution.</p>
    </div>` +
      '<div class="text-center"><a href="report-problem.html" class="btn btn-primary"><span data-icon="flag" style="width:16px;height:16px;display:inline-flex;vertical-align:-3px;"></span> Report a problem</a></div>';
    return;
  }
  var info = SUI.stageInfo();
  var label = s.stage === -2 ? "Needs more information" : (info ? info.label : "In progress");
  box.innerHTML = '<table><thead><tr><th>ID</th><th>Title</th><th>Category</th><th>Status</th><th>Reported</th><th></th></tr></thead><tbody>' +
   '<tr><td class="mono">' + s.problem.id + '</td><td>' + s.problem.title + '</td><td>' + s.problem.category + '</td>' +
   '<td><span class="badge badge-progress"><span class="badge-dot"></span>__L__</span>'.replace("__L__", label) + '</td>' +
   '<td class="muted">' + SUI.timeAgo(s.problem.reportedAt) + '</td>' +
   '<td><a href="problem-detail.html" class="btn btn-ghost btn-sm">Open</a></td></tr></tbody></table>';
});
</script>

  </div>
